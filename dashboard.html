
<h2>Overall Data:</h2>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Sample ID</th>
                <th>Total Count</th>
                <th>Population</th>
                <th>Count</th>
                <th>Percentage</th>
            </tr>
        </thead>

        <tbody id="sample-table">
        </tbody>
    </table>
</div>

<h2>PBMC Samples:</h2>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Response</th>
                <th>Sample ID</th>
                <th>Population</th>
                <th>Percentage</th>
            </tr>
        </thead>

        <tbody id="pbmc-table">
        </tbody>
    </table>
</div>

<h2>Graphs:</h2>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<div id="boxplot"></div>

<h2>Report:</h2>
<p id="stats-report"></p>

<h2>Baseline Data:</h2>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Sample ID</th>
            </tr>
        </thead>

        <tbody id="baseline-table">
        </tbody>
    </table>
</div>

<h2>Baseline Data Report:</h2>
<p id="baseline-report"></p>

<script>
    fetch("table_data.json")
        .then(response => response.json())
        .then(data => {
            const table = document.getElementById("sample-table");
            const population_count = data[0].population_list.length;
            data.forEach(row => {
                for (let i = 0; i < population_count; i++){
                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td>${row.sample_id}</td>
                        <td>${row.total_count}</td>
                        <td>${row.population_list[i].name}</td>
                        <td>${row.population_list[i].count}</td>
                        <td>${row.population_list[i].percentage}</td>
                    `;

                    table.appendChild(tr);
                }

                
            });
        });
    fetch("pbmc_data.json")
        .then(response => response.json())
        .then(data => {
            const table = document.getElementById("pbmc-table");
            const population_count = data[0].population_list.length;
            data.forEach(row => {
                for (let i = 0; i < population_count; i++){
                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td>${row.response}</td>
                        <td>${row.sample_id}</td>
                        <td>${row.population_list[i].name}</td>
                        <td>${row.population_list[i].percentage}</td>
                    `;

                    table.appendChild(tr);
                }

                
            });
        });
    fetch("boxplot_data.json")
        .then(response => response.json())
        .then(data => {

            const traces = [];

            Object.entries(data).forEach(([population, responses]) => {

                traces.push({
                    y: responses.no,
                    type: "box",
                    name: population + " - No"
                });

                traces.push({
                    y: responses.yes,
                    type: "box",
                    name: population + " - Yes"
                });

            });

            Plotly.newPlot("boxplot", traces, {
                title: "Cell Population Percentages",
                yaxis: {
                    title: "Percentage"
                },
                boxmode: "group"
            });
        });
    fetch("stats.json")
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById("stats-report");
            Object.entries(data).forEach(([population, result]) => {
                const div = document.createElement("div");

                div.innerHTML = `
                    <h3>${population}:</h3>
                    <p>U statistic: ${result.u}</p>
                    <p>p-value: ${result.p}</p>
                    <p>${result.msg}${result.p}</p>
                `;

                container.appendChild(div);
            });
        });
    fetch("baseline_data.json")
        .then(response => response.json())
        .then(data => {
            const table = document.getElementById("baseline-table");
            data.forEach(row => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td>${row.sample_id}</td>
                `;

                table.appendChild(tr);

                
            });
        });
    fetch("final_query_data.json")
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById("baseline-report");
            const div1 = document.createElement("div");
            div1.innerHTML = `
                    <h3>Project Counts:</h3>
                    <p>Project 1: ${data.project["1"]}</p>
                    <p>Project 2: ${data.project["2"]}</p>
                    <p>Project 3${data.project["3"]}</p>
                `;
            const div2 = document.createElement("div");
            div2.innerHTML = `
                    <h3>Response Counts:</h3>
                    <p>Responders: ${data.response.yes}</p>
                    <p>Non-responders: ${data.response.no}</p>
                `;
            const div3 = document.createElement("div");
            div3.innerHTML = `
                    <h3>Sex Counts:</h3>
                    <p>Male: ${data.sex["M"]}</p>
                    <p>Female: ${data.sex["F"]}</p>
                `;
            container.appendChild(div1);
            container.appendChild(div2);
            container.appendChild(div3);
        });
</script>
<style>
    .table-container {
        max-height: 400px;
        overflow-y: auto;
    }

    table {
        border-collapse: collapse;
        width: 100%;
    }

    th {
        position: sticky;
        top: 0;
        background: white;
    }

    th, td {
        padding: 8px;
        border: 1px solid #ccc;
    }
</style>
